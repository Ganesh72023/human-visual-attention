services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ml-service:
    build:
      context: ./ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      PORT: "5000"
      # Override MONGODB_URI in `.env` to use MongoDB Atlas (recommended for Render).
      # If not set, we fall back to the local `mongodb` container.
      MONGODB_URI: "${MONGODB_URI:-mongodb://mongodb:27017/hvaa}"
      JWT_SECRET: "${JWT_SECRET:-dev_secret_change_me_1234567890}"
      JWT_EXPIRES_IN: "1h"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173}"
      ML_SERVICE_URL: "http://ml-service:8000"
      UPLOAD_DIR: "/app/uploads"
      MAX_IMAGE_MB: "25"
      MAX_VIDEO_MB: "200"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@example.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-adminpassword}"
      ADMIN_NAME: "${ADMIN_NAME:-Admin}"
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - mongodb
      - ml-service

  frontend:
    build:
      context: ./client
    restart: unless-stopped
    environment:
      # When running the built frontend container, it will call the API by this URL from the browser.
      # For local docker compose, this is fine because the browser can access localhost:5000.
      VITE_API_URL: "${VITE_API_URL:-http://localhost:5000}"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_uploads:
